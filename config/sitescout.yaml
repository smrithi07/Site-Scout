# Savo SiteScout config. Every snapshot records `version`. Bump it on ANY change below.
# Weights/thresholds/radii/freshness/caps are filled in as each phase needs them (see docs/DESIGN.md).
version: "0.5.0"

region:
  name: Greater Chennai Corporation
  service_area: gcc_wards_2022   # union of the 200 GCC ward polygons
  metro_fringe: false            # decided at the Phase 2 gate
  min_hole_km2: 0.1              # smaller holes between wards are digitising slivers → filled
  min_pincode_part_km2: 0.05     # smaller Voronoi fragments are edge slivers → dropped

grid:
  score_res: 9    # ~0.1 km² — features, scoring, hotspots
  select_res: 8   # ~0.7 km² — what a BD Manager clicks on

localities:
  min_score: 0.3                    # trigram similarity floor for a search candidate
  min_score_with_exact_match: 0.5   # stricter floor once an exact (1.0) match exists
  max_results: 10

osm:
  extract: raw/osm/southern-zone-260927.osm.pbf   # under /data; pinned, md5-verified
  # Clip box: GCC plus the metro fringe (Avadi, Poonamallee, Tambaram) so the fringe can be
  # measured at the Phase 2 gate. lon_min, lat_min, lon_max, lat_max.
  bbox: [79.95, 12.75, 80.36, 13.35]
  # Roads that become survey segments. Motorways, tracks and footpaths are not survey lanes.
  road_classes: [trunk, trunk_link, primary, primary_link, secondary, secondary_link,
                 tertiary, tertiary_link, unclassified, residential, living_street, pedestrian, service]
  service_exclude: [driveway, parking_aisle, drive-through, emergency_access]
  main_road_classes: [trunk, primary, secondary, tertiary]
  local_road_classes: [residential, living_street, unclassified]
  # POI categories: first match wins. "*" = any value.
  poi_categories:
    competitor: {shop: [supermarket, convenience, grocery, greengrocer, general, deli, dairy, frozen_food]}
    transit:    {highway: [bus_stop], public_transport: [platform, station], railway: [station, halt],
                 amenity: [bus_station]}
    school:     {amenity: [school, college, university, kindergarten]}
    hospital:   {amenity: [hospital, clinic]}
    market:     {amenity: [marketplace], shop: [mall, department_store]}
    office:     {office: ["*"]}
  # Land-use classes from polygons. "sea" is derived from natural=coastline, not listed here.
  landuse_classes:
    residential: {landuse: [residential]}
    commercial:  {landuse: [commercial, retail]}
    industrial:  {landuse: [industrial]}
    water:       {natural: [water], landuse: [reservoir, basin], waterway: [riverbank]}
    wetland:     {natural: [wetland]}
    beach:       {natural: [beach, sand]}
    aeroway:     {aeroway: [aerodrome]}
    military:    {landuse: [military]}
    green:       {leisure: [park, nature_reserve], landuse: [forest, grass, recreation_ground], natural: [wood]}
  place_types: [suburb, neighbourhood, locality, quarter, village, hamlet, town]

ml_buildings:
  # Microsoft Global ML Building Footprints, release 2026-02-03, quadkeys 123312201/203/210/212
  # (data/raw/buildings_ms/dataset-links_chennai.csv). Added at the Phase 2 gate because OSM
  # buildings are unmapped in Manali/Thiruvottriyur/Tondiarpet/Sholinganallur.
  dir: raw/buildings_ms
  source: ms_global_ml_2026_02

mask:
  # A score cell is non-scoreable if these classes cover at least `min_blocking_share` of it…
  blocking_classes: [sea, water, wetland, beach, aeroway, industrial, military]
  min_blocking_share: 0.5
  # …or neither OSM nor the ML footprints have a building in it AND it has almost no local street.
  empty_max_local_road_m: 50

jobs:
  queues: [default]            # queues this deployment's worker serves (tests use their own)
  poll_seconds: 2              # idle worker's wait between claim attempts
  heartbeat_seconds: 5         # a running job's heartbeat interval
  stale_after_seconds: 30      # no heartbeat for this long → worker presumed dead → job re-queued
  max_attempts: 3              # re-queues after lost heartbeats before the job is failed for good

scoring:
  max_missing_weight_fraction: 0.40   # above this: facts only, no rating
