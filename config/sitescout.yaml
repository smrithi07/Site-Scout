# Savo SiteScout config. Every snapshot records `version`. Bump it on ANY change below.
# Weights/thresholds/radii/freshness/caps are filled in as each phase needs them (see docs/DESIGN.md).
version: "0.9.0"

region:
  name: Greater Chennai Corporation
  service_area: gcc_wards_2022   # union of the 200 GCC ward polygons
  metro_fringe: false            # decided at the Phase 2 gate
  min_hole_km2: 0.1              # smaller holes between wards are digitising slivers → filled
  min_pincode_part_km2: 0.05     # smaller Voronoi fragments are edge slivers → dropped

grid:
  score_res: 9    # ~0.1 km² — features, scoring, hotspots
  select_res: 8   # ~0.7 km² — what a BD Manager clicks on

localities:
  min_score: 0.3                    # trigram similarity floor for a search candidate
  min_score_with_exact_match: 0.5   # stricter floor once an exact (1.0) match exists
  max_results: 10

osm:
  extract: raw/osm/southern-zone-260927.osm.pbf   # under /data; pinned, md5-verified
  # Clip box: GCC plus the metro fringe (Avadi, Poonamallee, Tambaram) so the fringe can be
  # measured at the Phase 2 gate. lon_min, lat_min, lon_max, lat_max.
  bbox: [79.95, 12.75, 80.36, 13.35]
  # Roads that become survey segments. Motorways, tracks and footpaths are not survey lanes.
  road_classes: [trunk, trunk_link, primary, primary_link, secondary, secondary_link,
                 tertiary, tertiary_link, unclassified, residential, living_street, pedestrian, service]
  service_exclude: [driveway, parking_aisle, drive-through, emergency_access]
  main_road_classes: [trunk, primary, secondary, tertiary]
  local_road_classes: [residential, living_street, unclassified]
  # POI categories: first match wins. "*" = any value.
  poi_categories:
    competitor: {shop: [supermarket, convenience, grocery, greengrocer, general, deli, dairy, frozen_food]}
    transit:    {highway: [bus_stop], public_transport: [platform, station], railway: [station, halt],
                 amenity: [bus_station]}
    school:     {amenity: [school, college, university, kindergarten]}
    hospital:   {amenity: [hospital, clinic]}
    market:     {amenity: [marketplace], shop: [mall, department_store]}
    office:     {office: ["*"]}
  # Land-use classes from polygons. "sea" is derived from natural=coastline, not listed here.
  landuse_classes:
    residential: {landuse: [residential]}
    commercial:  {landuse: [commercial, retail]}
    industrial:  {landuse: [industrial]}
    water:       {natural: [water], landuse: [reservoir, basin], waterway: [riverbank]}
    wetland:     {natural: [wetland]}
    beach:       {natural: [beach, sand]}
    aeroway:     {aeroway: [aerodrome]}
    military:    {landuse: [military]}
    green:       {leisure: [park, nature_reserve], landuse: [forest, grass, recreation_ground], natural: [wood]}
  place_types: [suburb, neighbourhood, locality, quarter, village, hamlet, town]

ml_buildings:
  # Microsoft Global ML Building Footprints, release 2026-02-03, quadkeys 123312201/203/210/212
  # (data/raw/buildings_ms/dataset-links_chennai.csv). Added at the Phase 2 gate because OSM
  # buildings are unmapped in Manali/Thiruvottriyur/Tondiarpet/Sholinganallur.
  dir: raw/buildings_ms
  source: ms_global_ml_2026_02

mask:
  # A score cell is non-scoreable if these classes cover at least `min_blocking_share` of it…
  blocking_classes: [sea, water, wetland, beach, aeroway, industrial, military]
  min_blocking_share: 0.5
  # …or neither OSM nor the ML footprints have a building in it AND it has almost no local street.
  empty_max_local_road_m: 50

jobs:
  queues: [default]            # queues this deployment's worker serves (tests use their own)
  poll_seconds: 2              # idle worker's wait between claim attempts
  heartbeat_seconds: 5         # a running job's heartbeat interval
  stale_after_seconds: 30      # no heartbeat for this long → worker presumed dead → job re-queued
  max_attempts: 3              # re-queues after lost heartbeats before the job is failed for good

llm:
  # The LLM only phrases the fact sheet (Core rule 7). Provider order comes from .env
  # (LLM_PROVIDER, LLM_FALLBACK_PROVIDER); the template is always the last resort.
  prompt_version: "area-narrative-v1"   # bump when the prompt changes (it's part of the cache key)
  cache: true                  # same fact sheet + provider + model + prompt → reuse, no API call
  temperature: 0.2
  max_output_tokens: 1200
  connect_timeout_s: 5
  read_timeout_s: 40
  attempts_per_provider: 2     # 1 try + 1 retry, for transient errors and invalid output
  backoff_base_s: 1.0          # 1s, then 2s… (+ jitter) between retries
  backoff_max_s: 8
  total_budget_s: 90           # whole chain; past this → template
  min_interval_s: {gemini: 4.0, groq: 2.0}   # client-side spacing between calls (free-tier friendly)
  circuit_breaker: {failures: 3, cooldown_s: 300}   # skip a provider after 3 straight failures

properties:
  # Validation (docs/DESIGN.md §6). Rejections stop the save; warnings never do.
  reject_in_landuse: [water, sea]      # a pin inside these polygons is refused
  max_gps_accuracy_m: 50               # worse → warning
  max_distance_from_executive_m: 500   # pin this far from the executive's own position → warning
  duplicate_radius_m: 25               # duplicate = within this distance…
  duplicate_name_similarity: 0.35      # …and label trigram similarity ≥ this
  rent_outlier_factor: {low: 0.5, high: 2.0}   # outside band_min × low … band_max × high → warning
  critical_fields: [monthly_rent, area_sqft]   # missing → recommendation "Needs Info" (6b)
  photos: {max_bytes: 8000000, types: [image/jpeg, image/png, image/webp]}

evaluation:
  # Deterministic property evaluation (docs/DESIGN.md §6). Completeness is a gate, not a weight.
  weights: {site_demand: 25, competition: 15, cannibalisation: 15, rent_affordability: 15,
            accessibility: 10, visibility: 10, area_opportunity: 10}
  site_ring_k: 2                     # pin's cell + 2 rings ≈ 600 m (design: 500–600 m site radius)
  cannibalisation_hard_flag_m: 400   # operational Savomart closer than this → hard flag (caps outcome)
  max_missing_weight_fraction: 0.40  # above this → Needs Info
  outcome_bands: [{min: 70, label: Strong Fit}, {min: 50, label: Consider}, {min: 0, label: Weak Fit}]
  visibility_scores: {poor: 20, fair: 60, good: 100}
  frontage_ft: {low: 10, high: 20}   # ≤ low → 0, ≥ high → 100, linear between
  risks: {competitors_many: 5, road_width_narrow_ft: 12}

mock_rent_bands:
  # ILLUSTRATIVE ONLY (provenance: mock). ₹ per sq ft per month for small retail frontage, by GCC
  # zone group. Invented for the demo — not market data; labelled wherever it appears.
  label: illustrative
  default: [50, 120]
  groups:
    core: {zones: [8, 9, 10, 13], band: [90, 200]}              # Anna Nagar, Teynampet, Kodambakkam, Adyar
    inner: {zones: [5, 6, 11, 12, 14], band: [60, 140]}          # Royapuram, TVK Nagar, Valasaravakkam, Alandur, Perungudi
    outer: {zones: [7, 15], band: [50, 120]}                     # Ambattur, Sholinganallur
    north: {zones: [1, 2, 3, 4], band: [35, 90]}                 # Thiruvottiyur, Manali, Madhavaram, Tondiarpet

selection:
  # Counted in score cells (res 9, ~0.1 km² each). Floor ≈ one selection cell; cap ≈ 60 km².
  min_score_cells: 7
  max_score_cells: 600
  point_radius_m: 750        # extent for a locality that has only a point (labelled approximate)

scoring:
  # Factor weights (docs/DESIGN.md §5). Renormalised over the factors actually available.
  weights: {demand: 30, anchors: 20, competition: 20, cannibalisation: 15, accessibility: 15}
  max_missing_weight_fraction: 0.40   # above this: facts only, no rating
  min_scoreable_cells: 5              # fewer scoreable cells than this → insufficient data
  min_scoreable_share: 0.3            # …or less than this share of the selection is scoreable
  factor_min_coverage: 0.5            # a factor counts at area level if ≥ this share of cells have it
  # Walking-distance smoothing: count features in the cell plus k rings of neighbours
  # (k=1 ≈ 350 m radius, k=2 ≈ 650 m).
  neighbourhood_k: {anchors: 1, competition: 2, accessibility: 1}
  anchor_weights: {transit: 1.5, market: 1.5, school: 1.0, hospital: 1.0, office: 0.5}
  # Demand = ML building footprint area. Treated as missing (not zero) where a cell has streets
  # but no footprints at all — unmapped, not empty (the Phase 2 gate safety net).
  demand_missing_if: {ml_buildings_below: 1, local_road_m_at_least: 300}
  cannibalisation:
    max_distance_m: 5000       # beyond this, distance to the nearest store no longer matters
    radius_m: 1500             # "stores within" fact
    stores_max_age_days: 30    # older Stores cache → factor excluded (docs/DESIGN.md §8)
  accessibility: {main_road_multiplier: 2.0}
  rating_bands: [{min: 70, label: Strong fit}, {min: 50, label: Moderate fit}, {min: 0, label: Weak fit}]
  confidence:
    quality: {observed: 1.0, observed_self_reported: 0.8, derived: 0.8, observed_lower_bound: 0.7,
              proxy: 0.6, mock: 0.3, missing: 0.0}
    high: 0.75
    medium: 0.5
  hotspots: {count: 5, min_separation_k: 1}
